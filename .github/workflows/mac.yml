name: macOS

# Собирает dmg и zip для Apple Silicon и Intel и прикладывает их к релизу.
# С Linux macOS не собрать, поэтому сборка идёт на раннере GitHub.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза, к которому приложить файлы (например v0.3.1)"
        required: true

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Подписи нет: без поиска сертификата сборщик не падает и подписывает ad-hoc.
      - run: npm run dist:mac -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Приложить к релизу
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          ls -la release
          gh release upload "$TAG" release/*.dmg release/*.zip --clobber -R "$GITHUB_REPOSITORY"
